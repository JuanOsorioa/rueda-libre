name: Deploy Rueda Libre to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nocturna/package-lock.json

      - name: Install dependencies
        working-directory: ./nocturna
        run: npm ci

      - name: Build Tailwind CSS
        working-directory: ./nocturna
        run: npm run build

      - name: Prepare website
        run: |
          mkdir -p _site/nocturna

          cp index.html _site/
          cp -r img paginas styles _site/

          rsync -av \
            --exclude='node_modules' \
            --exclude='src' \
            --exclude='package*.json' \
            nocturna/ _site/nocturna/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4